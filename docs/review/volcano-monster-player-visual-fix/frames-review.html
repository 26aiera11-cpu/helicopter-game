<!doctype html><meta charset="utf-8"><title>33 frame review</title><style>body{margin:0;padding:22px;background:#172237;color:#e7f3ff;font:16px system-ui}h1{font-size:24px;margin:0 0 10px}h2{font-size:19px}p{color:#c3d7e8}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:1px solid #577083;border-radius:10px;padding:10px;text-align:center}.art{height:350px;max-width:95%;object-fit:contain}.check{background-color:#d5dce3;background-image:linear-gradient(45deg,#fff5 25%,transparent 25%,transparent 75%,#fff5 75%),linear-gradient(45deg,#fff5 25%,transparent 25%,transparent 75%,#fff5 75%);background-size:20px 20px;background-position:0 0,10px 10px}.frames{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.frame{text-align:center;background:#263b50;border-radius:7px;padding:6px;font-size:12px}.frame canvas{width:130px;height:130px}.players{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}.zoom{position:relative;width:128px;height:128px;overflow:hidden;margin:auto}.zoom img{position:absolute;width:915px;height:412px;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%) scale(3)}.scenes img{width:100%}</style><h1>교체 2종 · 33프레임 확대 검토</h1><p>원본 PNG와 매니페스트의 개별 좌표 사용 · 렌더링 시 알파 8 미만만 정리 · PNG 원본 미가공</p><main></main><script>window.reviewReady=false;(async()=>{const m=await(await fetch("../../../assets/volcano/asset_manifest.json")).json();for(const s of m.monsters.filter(s=>["lava_lizard","magma_dragon"].includes(s.id))){const h=document.createElement("h2");h.textContent=s.name_ko;document.querySelector("main").append(h);const grid=document.createElement("div");grid.className="frames";document.querySelector("main").append(grid);const im=new Image();im.src="../../../assets/volcano/"+s.atlas;await im.decode();for(const [state,a]of Object.entries(s.animations))for(let i=0;i<a.frames.length;i++){const f=a.frames[i],box=document.createElement("div"),c=document.createElement("canvas");box.className="frame";c.width=320;c.height=320;const [x,y,w,h]=f.rect_px,[dx,dy]=f.sprite_source_rect_px;const tmp=document.createElement("canvas");tmp.width=w;tmp.height=h;const g=tmp.getContext("2d");g.drawImage(im,x,y,w,h,0,0,w,h);const pixels=g.getImageData(0,0,w,h);for(let p=3;p<pixels.data.length;p+=4)if(pixels.data[p]<8)pixels.data.fill(0,p-3,p+1);g.putImageData(pixels,0,0);c.getContext("2d").drawImage(tmp,dx,dy);box.append(c,document.createElement("br"),state+" "+(i+1));grid.append(box);}}window.reviewReady=true;})();</script>
