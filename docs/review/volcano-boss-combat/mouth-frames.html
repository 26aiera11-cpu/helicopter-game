<!doctype html><meta charset="utf-8"><title>21 source mouth anchors</title><style>body{margin:0;padding:20px;background:#182335;color:#e8f2ff;font:16px system-ui}h1{font-size:25px}h2{font-size:18px}p{color:#bad2e6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:#26384c;border-radius:10px;padding:12px}.box img{width:100%;display:block}.rotation{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.frames{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.frame{text-align:center;background:#2d4053;border-radius:8px;padding:7px}.frame canvas{width:145px;height:145px}.detail{height:340px;position:relative;overflow:hidden;background:#243449}.detail img{position:absolute;max-width:none;transform-origin:top left}</style><h1>승인된21프레임 · 입 기준점 검토</h1><p>원본 개별 프레임 좌표와 가상320셀을 사용합니다. 빨간 점은 화염 시작점이며 원본PNG에는 추가하지 않았습니다.</p><main class="frames"></main><script>window.ready=false;(async()=>{const m=await(await fetch("../../../assets/volcano/asset_manifest.json")).json(),audit=await(await fetch("../../../tests/volcano_dragon_mouth_anchors.json")).json(),spec=m.monsters.find(s=>s.id==="magma_dragon"),im=new Image();im.src="../../../assets/volcano/"+spec.atlas;await im.decode();for(const row of audit.samples){const f=spec.animations[row.state].frames.find(f=>f.index===row.index),[x,y,w,h]=f.rect_px,[dx,dy]=f.sprite_source_rect_px,box=document.createElement("div"),c=document.createElement("canvas"),crop=document.createElement("canvas");c.width=c.height=320;crop.width=w;crop.height=h;const cg=crop.getContext("2d");cg.drawImage(im,x,y,w,h,0,0,w,h);const pixels=cg.getImageData(0,0,w,h);for(let p=3;p<pixels.data.length;p+=4)if(pixels.data[p]<8)pixels.data.fill(0,p-3,p+1);cg.putImageData(pixels,0,0);const g=c.getContext("2d");g.drawImage(crop,dx,dy);g.fillStyle="#ff4848";g.beginPath();g.arc(dx+row.mouth_in_crop[0],dy+row.mouth_in_crop[1],3,0,Math.PI*2);g.fill();box.className="frame";box.append(c,document.createElement("br"),row.state+" "+(row.index+1));document.querySelector("main").append(box);}window.ready=true;})();</script>
